[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image-classification-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor for whole-image labelling"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
image-classification-claim-audit = "image_classification_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["image_classification_claim_audit*"]
